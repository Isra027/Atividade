
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Velha</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        .tabuleiro {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            justify-content: center;
            gap: 5px;
        }

        button {
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
        }

        #mensagem {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Jogo da Velha</h1>

    <p id="mensagem">Vez do jogador X</p>

    <div class="tabuleiro">
        <button onclick="jogar(0)"></button>
        <button onclick="jogar(1)"></button>
        <button onclick="jogar(2)"></button>
        <button onclick="jogar(3)"></button>
        <button onclick="jogar(4)"></button>
        <button onclick="jogar(5)"></button>
        <button onclick="jogar(6)"></button>
        <button onclick="jogar(7)"></button>
        <button onclick="jogar(8)"></button>
    </div>

    <br>

    <button onclick="reiniciar()">Reiniciar</button>

    <script>
        let jogador = "X";
        let fim = false;

        let casas = document.querySelectorAll(".tabuleiro button");

        function jogar(posicao) {

            if (casas[posicao].innerHTML == "" && fim == false) {

                casas[posicao].innerHTML = jogador;

                verificar();

                if (fim == false) {
                    if (jogador == "X") {
                        jogador = "O";
                    } else {
                        jogador = "X";
                    }

                    document.getElementById("mensagem").innerHTML =
                        "Vez do jogador " + jogador;
                }
            }
        }

        function verificar() {

            let combinacoes = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            for (let i = 0; i < combinacoes.length; i++) {

                let a = combinacoes[i][0];
                let b = combinacoes[i][1];
                let c = combinacoes[i][2];

                if (
                    casas[a].innerHTML != "" &&
                    casas[a].innerHTML == casas[b].innerHTML &&
                    casas[b].innerHTML == casas[c].innerHTML
                ) {
                    document.getElementById("mensagem").innerHTML =
                        "Jogador " + jogador + " venceu!";

                    fim = true;
                    return;
                }
            }

            let empate = true;

            for (let i = 0; i < casas.length; i++) {
                if (casas[i].innerHTML == "") {
                    empate = false;
                }
            }

            if (empate == true) {
                document.getElementById("mensagem").innerHTML =
                    "Deu empate!";
                fim = true;
            }
        }

        function reiniciar() {

            for (let i = 0; i < casas.length; i++) {
                casas[i].innerHTML = "";
            }

            jogador = "X";
            fim = false;

            document.getElementById("mensagem").innerHTML =
                "Vez do jogador X";
        }
    </script>

</body>
</html>
