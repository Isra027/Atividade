<!DOCTYPE html>
<html lang="pt-br">

<head>
    <style>

    </style>
</head>

<body>
    <div id="filtros">
        <button class="filtro ativo"
          data-filtro="todos">Todos</button>
        <button class="filtro"
          data-filtro="frontend">Frontend</button>
        <button class="filtro"
          data-filtro="backend">Backend</button>
    </div>

    <section id="projetos">
        <article data-categoria="frontend">
            <h3>Portfólio Pessoal</h3>
            <p>Site responsivo em HTML e CSS.</p>
        </article>

        <article data-categoria="backend">
            <h3>API de Tarefas</h3>
            <p>CRUD em Node.js com Express.</p>
        </article>
    </section>

    <script>
        const botoes   = document.querySelectorAll(".filtro");
        const projetos = document
            .querySelectorAll("#projetos article");

        botoes.forEach(btn => {
            btn.addEventListener("click", () => {

        botoes.forEach(b => b.classList.remove("ativo"));
            btn.classList.add("ativo");

        const alvo = btn.dataset.filtro;

        projetos.forEach(p => {
            const mostrar = alvo === "todos"
                || p.dataset.categoria === alvo;
            p.hidden = !mostrar;
            });
        });
    });
    </script>
</body>

</html>
